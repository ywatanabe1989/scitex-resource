name: pr-ci

# Consolidated PR-only CI gate. Runs the per-PR validation suite as a
# single workflow so the cancel-in-progress concurrency group, path
# filters, and uv cache apply uniformly. Post-merge validation lives
# in release-ci.yml.
#
# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# `tests` -> pytest-matrix and `audit` -> quality-audit are now thin
# `uses:` calls into scitex-ai/.github reusable workflows — same job
# intent, now centrally maintained. `import-smoke` and
# `dep-hygiene-smoke` are left inlined (see notes on each job below) —
# their bodies don't cleanly match the org reusable equivalents.
# Triggers/concurrency preserved verbatim from the prior local file.
#
# New required-status-check contexts (see comments per job below) may not
# match OLD required-status-check contexts on develop/main branch
# protection — branch protection updated as part of this PR where needed.

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '_skills/**'
      - 'examples/**'
      - '**.md'
      - 'CHANGELOG.*'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # NOT migrated: this job also smoke-checks the console-script
  # entrypoints (`scitex-resource --help`, `scitex-resource-mcp --help`)
  # beyond a plain import check. The org `import-smoke.yml` reusable only
  # covers the plain import — converting would silently drop that
  # entrypoint coverage, so left inlined per the migration brief.
  import-smoke:
    name: import-smoke-on-ubuntu-py3-12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python 3.12 (uv-managed)
        run: uv python install 3.12
      - name: Install (no extras) in uv venv
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e .
      - name: Import smoke
        run: .venv/bin/python -c "import scitex_resource; print(getattr(scitex_resource, '__version__', 'unversioned'))"
      - name: smoke scitex-resource --help
        run: .venv/bin/scitex-resource --help
      - name: smoke scitex-resource-mcp --help
        run: .venv/bin/scitex-resource-mcp --help

  # NOT migrated: no reusable-workflow equivalent exists yet for a
  # bare/no-extras dependency-hygiene install smoke check.
  dep-hygiene-smoke:
    name: dep-hygiene-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Set up Python 3.11 (uv-managed)
        run: uv python install 3.11
      - name: Bare install (no extras) in uv venv
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python .
      - name: Import package
        run: .venv/bin/python -c "import scitex_resource; print(scitex_resource.__name__)"

  tests:
    # New required-status-check context: "tests / pytest-matrix-on-ubuntu-py<X.YY>"
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit

  audit:
    # New required-status-check context: "audit / audit"
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit
