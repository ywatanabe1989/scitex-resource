name: release-ci

# Post-merge validation gate. Runs on push to protected branches
# (main, develop) and as the canonical scheduled run. Always uses the
# FULL pytest matrix — no conditional skipping — so the protected-branch
# history is exercised on every supported Python.
#
# PILOT: org-level reusable-workflow caller (scitex-ai/.github, 2026-07-10).
# Replaces the formerly-inlined `tests` (pytest-matrix), `import-smoke`,
# and `audit` (quality-audit) jobs with thin `uses:` calls into
# scitex-ai/.github reusable workflows — same job bodies, now centrally
# maintained. Triggers/concurrency preserved verbatim from the prior
# local file.
#
# New required-status-check contexts (see comments per job below) may not
# match OLD required-status-check contexts on develop/main branch
# protection — branch protection updated as part of this PR where needed.

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: "0 17 * * *"  # nightly 17:00 UTC (~02:00 JST), off-peak
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    # New required-status-check context: "tests / pytest-matrix-on-ubuntu-py<X.YY>"
    uses: scitex-ai/.github/.github/workflows/pytest-matrix.yml@main
    secrets: inherit

  import-smoke:
    # New required-status-check context: "import-smoke / import-smoke-on-ubuntu-py3-12"
    uses: scitex-ai/.github/.github/workflows/import-smoke.yml@main
    secrets: inherit

  audit:
    # New required-status-check context: "audit / audit"
    uses: scitex-ai/.github/.github/workflows/quality-audit.yml@main
    secrets: inherit
