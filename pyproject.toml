[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitex-resource"
version = "0.4.5"
description = "System resource info, processor usage logging, RAM limit — standalone module from the SciTeX ecosystem"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.9"
authors = [{name = "Yusuke Watanabe", email = "ywatanabe@scitex.ai"}]
keywords = ["scitex", "resource", "psutil", "system-info", "ram-limit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Hardware",
]
dependencies = [
    "click>=8.0",
    "pandas",
    "psutil",
    "PyYAML",
    "matplotlib",
    "scitex-dev>=0.11.7",  # try_import_optional helper (src/_utils/_get_env_info.py)
    # `fastmcp` is a HARD core dep, but NOT because anything imports it at
    # module-load: `_cli/_mcp_commands.py` imports `.._mcp.server` inside each
    # command body, and `_mcp/server.py` guards its own `from fastmcp import
    # FastMCP` with try/except + an install hint. The console-script therefore
    # imports cleanly without fastmcp present.
    #
    # It stays in core because the failure it prevents is a USER-VISIBLE one:
    # `scitex-resource mcp start` on a bare `pip install scitex-resource` would
    # raise at the moment of use instead of at install time, and the second
    # console-script `scitex-resource-mcp` (-> `_mcp.server:main`) does reach
    # the guarded import immediately. Operator ruling: a runtime "X がありません"
    # is far worse for users than a fatter install. PS-213
    # console-script-deps-must-be-core (scitex-dev v0.17.10+) is the
    # ecosystem-wide form of that rule. Keep the dep; keep the imports lazy.
    "fastmcp>=0.1.0",
]

[project.optional-dependencies]
cli = [
    "ruamel.yaml>=0.18",
]
sh = [
    "scitex-sh>=0.1.0",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ruamel.yaml>=0.18",  # CLI `machine config` round-trip YAML writes
    "scitex-sh>=0.1.0",  # tests/integration/test_cross_package_imports.py
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-autodoc-typehints>=1.25",
]
all = [
    "scitex-resource[sh]",
    "scitex-resource[cli]",
    "scitex-resource[dev]",
    "scitex-resource[docs]",
]

[project.scripts]
scitex-resource = "scitex_resource._cli:main"
scitex-resource-mcp = "scitex_resource._mcp.server:main"

[project.urls]
Homepage = "https://github.com/ywatanabe1989/scitex-resource"
Repository = "https://github.com/ywatanabe1989/scitex-resource"
Documentation = "https://scitex-resource.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitex_resource = ["_skills/**/*.md", "_get_specs/*.yaml", "_sphinx_html/**"]

[project.entry-points."scitex_dev.skills"]
scitex-resource = "scitex_resource"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--disable-warnings"]

[tool.coverage.run]
parallel = true
source = ["scitex_resource"]
concurrency = ["multiprocessing", "thread"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.scitex-linter]
library_dirs = ["src", "tests", "examples", "apps", "config", "docs"]
